apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ceph-tenant

resources:
- ../../base

patches:
- patch: |-
    - op: replace
      path: /metadata/name
      value: qe-build-email-9-0
    - op: replace
      path: /spec/application
      value: ceph-9-0
  target:
    kind: IntegrationTestScenario
